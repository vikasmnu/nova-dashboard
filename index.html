<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nova Dashboard</title>

    <link rel="icon"
          href="assets/images/favicon.ico">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ========================================= -->
    <!-- Background -->
    <!-- ========================================= -->

    <div id="background"></div>

    <div class="overlay"></div>

    <!-- ========================================= -->
    <!-- Dashboard -->
    <!-- ========================================= -->

    <main class="dashboard">

        <!-- ========================================= -->
        <!-- Header -->
        <!-- ========================================= -->

        <header class="header">

            <!-- Logo -->

            <div class="logo-container">

                <img src="assets/images/logo.png"
                     alt="Nova Logo"
                     class="logo">

                <span class="logo-text">

                    Nova

                </span>

            </div>

            <!-- Weather -->

            <section class="weather-widget glass">

                <div class="widget__header">

                    <div class="weather-top">

                        <img
                            id="weather-icon"
                            src="assets/icons/ui/weather.svg"
                            alt="Weather">

                        <span id="temperature">

                            --°

                        </span>

                    </div>

                </div>

                <div class="widget__body">

                    <p id="location">

                        Detecting location...

                    </p>

                </div>

            </section>

            <!-- Settings -->

            <button
                id="settings-btn"
                class="icon-button">

                <img src="assets/icons/ui/settings.svg"
                     alt="Settings">

            </button>

        </header>

        <!-- ========================================= -->
        <!-- Hero -->
        <!-- ========================================= -->

        <section class="hero">

            <h1 id="clock">

                00:00

            </h1>

            <h2 id="greeting">

                Good Morning,

            </h2>

            <h3 id="username">

                Vikas

            </h3>

            <p id="current-date">

                Monday, 1 January

            </p>

            <!-- Search -->

            <form
                id="search-form"
                class="search-bar glass">

                <img
                    src="assets/icons/ui/search.svg"
                    alt="Search">

                <input
                    id="search-input"
                    type="text"
                    placeholder="Search Google...">

            </form>

        </section>

        <!-- ========================================= -->
        <!-- Quick Links -->
        <!-- ========================================= -->

        <section
            id="quick-links"
            class="quick-links">

            <!-- Generated dynamically -->

        </section>

        <!-- ========================================= -->
        <!-- Widgets -->
        <!-- ========================================= -->

        <section class="widgets">

            <!-- Focus -->

            <article
                id="focus-widget"
                class="widget glass card">

                <div class="widget__header">

                    <h3 class="widget__title">

                        Today's Focus

                    </h3>

                </div>

                <div class="widget__body">

                    <input
                        id="focus-input"
                        type="text"
                        placeholder="What is your main goal today?">

                </div>

            </article>

            <!-- Quote -->

            <article
                id="quote-widget"
                class="widget glass card">

                <div class="widget__header">

                    <h3 class="widget__title">

                        Daily Quote

                    </h3>

                </div>

                <div class="widget__body">

                    <blockquote id="quote">

                        Loading...

                    </blockquote>

                </div>

                <div class="widget__footer">

                    <cite id="quote-author">

                    </cite>

                </div>

            </article>

            <!-- Market -->

            <article
                id="market-widget"
                class="widget glass card">

                <div class="widget__header">

                    <h3 class="widget__title">

                        Markets

                    </h3>

                </div>

                <div class="widget__body">

                    <div class="market-row">

                        <span>NIFTY 50</span>

                        <span id="nifty">

                            Loading...

                        </span>

                    </div>

                    <div class="market-row">

                        <span>BANKNIFTY</span>

                        <span id="banknifty">

                            Loading...

                        </span>

                    </div>

                </div>

            </article>

        </section>

        <!-- ========================================= -->
        <!-- Footer -->
        <!-- ========================================= -->

        <footer class="footer">

            <p id="background-author">

                Photo by Unsplash

            </p>

            <span>

                Nova Dashboard v1.0

            </span>

        </footer>

    </main>

    <!-- ========================================= -->
    <!-- Tasks Sidebar -->
    <!-- ========================================= -->

    <aside
        id="tasks-panel"
        class="sidebar">

        <div class="sidebar-header">

            <h2>

                Tasks

            </h2>

            <button id="close-tasks">

                ✕

            </button>

        </div>

        <div
            id="task-list"
            class="sidebar-body">

            <!-- Generated dynamically -->

        </div>

        <div class="task-input">

            <input
                id="new-task"
                type="text"
                placeholder="Add a task">

            <button
                id="add-task"
                class="button button-primary">

                Add

            </button>

        </div>

    </aside>

    <!-- ========================================= -->
    <!-- Settings Sidebar -->
    <!-- ========================================= -->

    <aside
        id="settings-panel"
        class="sidebar">

        <div class="sidebar-header">

            <h2>

                Settings

            </h2>

            <button id="close-settings">

                ✕

            </button>

        </div>

        <div
            id="settings-content"
            class="sidebar-body">

            <!-- Generated dynamically -->

        </div>

    </aside>

    <!-- ========================================= -->
    <!-- JavaScript -->
    <!-- ========================================= -->

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>

    <script src="js/background.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/greeting.js"></script>

    <script src="js/search.js"></script>
    <script src="js/quicklinks.js"></script>

    <script src="js/focus.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/quotes.js"></script>

    <script src="js/market.js"></script>
    <script src="js/settings.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
